<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>잿빛 심연</title>
<meta name="theme-color" content="#0d0b0a">
<meta name="description" content="자동 전투로 장비를 모아 빌드를 짜는 파밍 RPG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="잿빛 심연">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b0a;--panel:#16120f;--panel2:#1d1813;--line:#352b21;--line2:#4a3c2d;
  --text:#e9ddc7;--dim:#9a8b75;--accent:#d9a441;--red:#c94a3a;--green:#74d083;--blue:#7cc4f0;
  --r0:#c9c4ba;--r1:#6aa8ff;--r2:#ffd65c;--r3:#ff8a3d;--r4:#5fd38a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 30% 0%,#231a12 0%,var(--bg) 60%);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;cursor:pointer;transition:background .12s,border-color .12s}
button:hover:not(:disabled){background:#2a2219;border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:#3a2a14;border-color:var(--accent);color:#ffe3a6}
button.danger{border-color:#6b2a22;color:#ffb3a8}
#app{max-width:1280px;margin:0 auto;padding:10px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:6px 4px 10px;border-bottom:1px solid var(--line)}
.brand h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:24px;margin:0;letter-spacing:.06em;color:#f0d49a;text-shadow:0 0 18px rgba(217,164,65,.25)}
.brand .sub{font-size:11px;color:var(--dim);letter-spacing:.08em}
.res{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap}
.lv{font-size:15px}.lv b{color:#ffe3a6;font-size:18px}
.xpbar{position:relative;width:180px;height:14px;background:#0a0807;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#6b4bc2,#a07cf0);width:0}
.xpbar span{position:absolute;inset:0;font-size:10px;text-align:center;line-height:12px;color:#eee}
.cur{font-size:15px}.cur b{font-variant-numeric:tabular-nums}
.g{color:#f5c84a}.s{color:#9fd8ff}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;margin-top:10px}
@media (max-width:900px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
#stagebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sname{min-width:150px;text-align:center}.sname b{font-family:'Nanum Myeongjo',serif;font-size:17px;color:#f0d49a;display:block}.sname small{color:var(--dim);font-size:11px}
.sp{flex:1}
.tog{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--dim);cursor:pointer}
#bossBtn{background:#3d1712;border-color:#a8412f;color:#ffc2b3;font-weight:700}
#bossBtn.hide{display:none}
.bar{position:relative;height:12px;background:#0a0807;border:1px solid var(--line2);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{position:absolute;inset:0 auto 0 0;width:0;transition:width .15s}
.bar span{position:absolute;inset:0;font-size:10px;text-align:center;line-height:10px;color:#eee;text-shadow:0 1px 2px #000}
#killbar i{background:linear-gradient(90deg,#7a4a1c,#d9a441)}
#hpbar{height:16px}#hpbar span{line-height:14px;font-size:11px}
#hpbar i{background:linear-gradient(90deg,#8a1f1a,#d2493a);transition:width .08s}
.cvwrap{margin-top:8px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000}
canvas{display:block;width:100%;height:270px}
#skillbar{display:flex;gap:8px;margin-top:8px}
.sk{position:relative;flex:1;height:44px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;padding:0 4px}
.sk .cd{position:absolute;left:0;bottom:0;width:100%;background:rgba(0,0,0,.62);height:0}
.sk .nm{position:relative;z-index:1}
.sk .lvl{position:absolute;right:4px;top:2px;font-size:9px;color:var(--dim);z-index:1}
.sk.empty{color:#5d5040;border-style:dashed}
#log{margin-top:8px;height:150px;overflow-y:auto;font-size:12px;background:#0c0a08;border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:#bfb39f}
#log div{padding:1px 0}
.c4{color:var(--r4)}
.c0{color:var(--r0)}.c1{color:var(--r1)}.c2{color:var(--r2)}.c3{color:var(--r3);text-shadow:0 0 8px rgba(255,138,61,.45)}
#tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
#tabs button{flex:1;background:transparent;border-color:transparent}
#tabs button.on{background:var(--panel2);border-color:var(--line2);color:#ffe3a6}
#tabs button .badge{display:inline-block;min-width:16px;padding:0 4px;height:16px;line-height:16px;border-radius:8px;background:#2f6b46;color:#d6ffe2;font-size:10px;margin-left:5px;vertical-align:middle;font-weight:700}
#tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
h3{font-family:'Nanum Myeongjo',serif;font-size:15px;margin:12px 0 6px;color:#e6c88a;display:flex;align-items:center;gap:8px}
h3 .r{margin-left:auto;font-family:'Noto Sans KR';font-size:12px;color:var(--dim);font-weight:400}
.eqgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.invgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
@media (max-width:520px){.invgrid{grid-template-columns:repeat(6,1fr)}.eqgrid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;aspect-ratio:1;border:1.5px solid var(--line2);border-radius:7px;background:#100d0b;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s}
.card:hover{transform:translateY(-1px)}
.card svg{width:56%;height:56%}
.card .il{position:absolute;bottom:1px;right:4px;font-size:9px;color:var(--dim)}
.card .en{position:absolute;top:1px;left:4px;font-size:9px;color:#ffe3a6}
.card .up{position:absolute;top:0;right:3px;font-size:10px;color:var(--green);font-weight:700}
.card .lk{position:absolute;bottom:1px;left:4px;font-size:9px;color:#ffb3a8}
.card.empty{border-style:dashed;cursor:default;color:#4a3e31;font-size:11px}
.card.r0{border-color:#57534c}.card.r0 svg{fill:var(--r0)}
.card.r1{border-color:#3b5f99;background:#0e1320}.card.r1 svg{fill:var(--r1)}
.card.r2{border-color:#8f7631;background:#17140a}.card.r2 svg{fill:var(--r2)}
.card.r3{border-color:#d06a2a;background:#1d0f07;box-shadow:0 0 10px rgba(255,138,61,.35) inset}.card.r3 svg{fill:var(--r3)}
.card.r4{border-color:#2f8a55;background:#0a1a10;box-shadow:0 0 10px rgba(95,211,138,.25) inset}.card.r4 svg{fill:var(--r4)}
.setbox{margin-top:8px;border:1px solid #2f6b46;background:#0b1710;border-radius:7px;padding:7px 9px;font-size:12.5px;color:#b9e8c8}
.setbox b{color:var(--r4)}.setbox .off{color:#5f7a68}.setbox .on{color:#d6ffe2}.setbox .pt{display:inline-block;margin-right:8px;font-size:11.5px}
.setbox .wh{color:var(--dim);font-size:11px}
.card.sel{outline:2px solid #fff;outline-offset:1px}
.filt{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.filt button{padding:3px 8px;font-size:12px}
.filt button.on{background:#3a2a14;border-color:var(--accent);color:#ffe3a6}
.dex{display:grid;grid-template-columns:1fr;gap:6px}
.dexrow{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#100d0b;font-size:12px}
.dexrow b{font-size:13px}.dexrow .pt{display:inline-block;margin:2px 8px 0 0;color:#5f5548}.dexrow .pt.on{color:#d6ffe2}
.dexrow .wh{color:var(--dim);font-size:11px}
.full{color:#ff8b7d!important}
.rules{border:1px solid var(--line);background:#100d0b;border-radius:8px;padding:6px 9px;font-size:12.5px}
.rules .rl{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0;border-bottom:1px dashed #2a221a}
.rules .rl:last-of-type{border-bottom:0}.rules .rl small{color:var(--dim)}.rules label{display:flex;align-items:center;gap:5px;cursor:pointer}
.rules .chk{gap:8px}
select{font:inherit;font-size:12px;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:2px 4px;max-width:150px}
.slotlbl{font-size:10px;color:var(--dim);text-align:center;margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:12.5px;background:#100d0b;border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.stats div{display:flex;justify-content:space-between}
.stats span{color:var(--dim)}
.stats b{font-weight:500;font-variant-numeric:tabular-nums}
.legs{font-size:12px;color:var(--r3);margin-top:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row small{color:var(--dim)}
.list{display:flex;flex-direction:column;gap:6px}
.li{border:1px solid var(--line);background:#100d0b;border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:center}
.li .t{flex:1;min-width:0}
.li .t b{color:#f0d49a}
.li .t p{margin:2px 0 0;font-size:12px;color:var(--dim)}
.li.locked{opacity:.45}
.tag{display:inline-block;font-size:10px;padding:0 5px;border:1px solid var(--line2);border-radius:8px;color:var(--dim);margin-left:2px;line-height:15px}
.brrow{margin-top:6px;border-top:1px dashed #2a221a;padding-top:5px}
.brrow.lockd{font-size:11px;color:#6a5d4c}
.brlv{font-size:11px;color:var(--accent)}.brlv .new{color:#ffe3a6;background:#3a2a14;border-radius:6px;padding:0 5px;font-size:10px}
.brops{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:4px;margin-top:3px}
.bro{text-align:left;padding:4px 6px;display:flex;flex-direction:column;gap:1px}.bro b{font-size:12px;color:#e9ddc7}.bro small{font-size:10.5px;color:var(--dim);line-height:1.3}
.bro.on{background:#2a2014;border-color:var(--accent)}.bro.on b{color:#ffe3a6}
.brc{font-size:10px;color:var(--dim)}
.socks{display:flex;gap:4px;flex-wrap:wrap;align-items:stretch;margin-top:6px}.socks .brlv{width:100%}
.sock{flex:1;min-width:90px;font-size:11px;padding:3px 6px;text-align:left;display:flex;flex-direction:column;border-style:dashed}
.sock.on{border-style:solid;background:#151b24;border-color:#3b5f99}.sock.on small{font-size:10px;color:var(--dim);line-height:1.25}.sock.lockd{color:#5d5040;border:1px dashed #3a2f24;border-radius:6px;justify-content:center;align-items:center}
.gembag{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}.gemrow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:#100d0b;border-radius:7px;padding:5px 8px}
.gemrow .t{flex:1;min-width:0}.gemrow p{margin:1px 0 0;font-size:11.5px;color:var(--dim)}.gbtns{display:flex;flex-direction:column;gap:3px}.gbtns button{font-size:11px;padding:2px 7px}
.gempick{text-align:left;display:flex;flex-direction:column;gap:1px}.gempick small{color:var(--dim)}
.slotbtns{display:flex;gap:3px}
.slotbtns button{padding:3px 8px;font-size:12px}
.slotbtns button.on{background:#3a2a14;border-color:var(--accent);color:#ffe3a6}
.pips{font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.hide{display:none}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox h2{font-family:'Nanum Myeongjo',serif;margin:0;font-size:19px}
.meta{font-size:12px;color:var(--dim);margin:3px 0 10px}
.imp{font-size:12.5px;color:#b9ad97;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.aff{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:3px 0;color:#a9c9ff}
.aff button{padding:1px 7px;font-size:11px}
.legbox{margin-top:8px;border:1px solid #6b3a1c;background:#1c0f07;border-radius:7px;padding:7px 9px;font-size:12.5px;color:#ffc59a}
.legbox b{color:var(--r3)}
.legbox .legsk{font-size:11px;color:#ffe3a6;background:#3a2210;border-radius:6px;padding:0 5px}
.cmp{margin-top:10px;font-size:12.5px;background:#100d0b;border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.cmp div{display:flex;justify-content:space-between}
.pos{color:var(--green)}.neg{color:#ff8b7d}
.mbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.mbtns button{flex:1}
.note{font-size:11px;color:var(--dim);margin-top:6px}
textarea{width:100%;height:80px;background:#0c0a08;color:var(--text);border:1px solid var(--line2);border-radius:6px;font-size:11px;padding:6px}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:60;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:#1d0f07;border:1px solid var(--r3);color:#ffd2ae;padding:8px 16px;border-radius:8px;font-size:13px;box-shadow:0 0 24px rgba(255,138,61,.35);animation:tin 3s forwards}
#toast div.plain{border-color:var(--line2);color:var(--text);background:var(--panel2);box-shadow:none}
@keyframes tin{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.chk{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.chk label{display:flex;gap:5px;align-items:center;cursor:pointer}
.kv{font-size:12.5px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:#100d0b;border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.kv span{color:var(--dim)}
.speed button.on{background:#3a2a14;border-color:var(--accent);color:#ffe3a6}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>잿빛 심연</h1><div class="sub">ASHEN DEPTHS · 자동 전투 파밍 RPG · v0.6.0</div></div>
    <div class="res">
      <div class="lv">Lv <b id="lv">1</b></div>
      <div class="xpbar"><i id="xpf"></i><span id="xpt"></span></div>
      <div class="cur" title="골드"><span class="g">●</span> <b id="gold">0</b></div>
      <div class="cur" title="마력석 (분해로 획득)"><span class="s">◆</span> <b id="stones">0</b></div>
    </div>
  </header>
  <main>
    <section id="left">
      <div id="stagebar">
        <button id="sPrev" title="이전 스테이지">◀</button>
        <div class="sname"><b id="sname"></b><small id="ssub"></small></div>
        <button id="sNext" title="다음 스테이지">▶</button>
        <div class="sp"></div>
        <label class="tog"><input type="checkbox" id="autoPush"> 자동 진행</label>
        <button id="bossBtn" class="hide">보스 도전</button>
      </div>
      <div class="bar" id="killbar"><i id="killf"></i><span id="killt"></span></div>
      <div class="cvwrap"><canvas id="cv"></canvas></div>
      <div class="bar" id="hpbar"><i id="hpf"></i><span id="hpt"></span></div>
      <div id="skillbar"></div>
      <div id="log"></div>
    </section>
    <section id="right">
      <nav id="tabs">
        <button data-tab="equip" class="on">장비</button>
        <button data-tab="skills">스킬</button>
        <button data-tab="talents">특성</button>
        <button data-tab="settings">기록·설정</button>
      </nav>
      <div id="panel"></div>
    </section>
  </main>
</div>
<div id="modal" class="hide"></div>
<div id="toast"></div>

<script>
"use strict";
// ================= 유틸 =================
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sc=l=>Math.pow(1.1,l-1);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(n){
  if(!isFinite(n))return '∞';
  const neg=n<0;let a=Math.abs(n);
  if(a<1000)return (neg?'-':'')+(a<10&&a%1>0.05?a.toFixed(1):Math.floor(a));
  const u=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No'];let i=-1;
  while(a>=1000&&i<u.length-1){a/=1000;i++;}
  if(a>=1000)return (neg?'-':'')+Math.abs(n).toExponential(2);
  return (neg?'-':'')+a.toFixed(a<10?2:a<100?1:0)+u[i];
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ================= 데이터 =================
const ICON={
  weapon:'<path d="M20 2h2v2L10 16l-2-2zM4 14l6 6-1.5 1.5-1.5-1.5-2.5 2.5-1.5-1.5 2.5-2.5-1.5-1.5z"/>',
  helm:'<path d="M12 3C7 3 4 7 4 12v6h4v-5h8v5h4v-6c0-5-3-9-8-9z"/>',
  chest:'<path d="M7 3 3 6l2 5 2-1v11h10V10l2 1 2-5-4-3c-1 2-3 3-5 3S8 5 7 3z"/>',
  gloves:'<path d="M7 21v-6L4 11l2-1 2 2V4h2v6h1V3h2v7h1V4h2v7h1V6h2v9l-3 6z"/>',
  boots:'<path d="M7 2h6v11l7 3v5H4v-3l3-1z"/>',
  ring:'<path fill-rule="evenodd" d="M12 7a7 7 0 1 0 .01 0zM12 10a4 4 0 1 1-.01 0zM9 1h6l-3 5z"/>',
  amulet:'<path d="M5 2c0 5 3 8 7 9 4-1 7-4 7-9h-2c0 4-2 6-5 7-3-1-5-3-5-7zM12 12l4 5-4 5-4-5z"/>'
};
const SLOTS=[
  {id:'weapon',n:'무기',bases:['장검','전투 도끼','철퇴','쌍날검','대검'],imp:{atk:6}},
  {id:'helm',n:'투구',bases:['철투구','두건','뿔 투구','왕관 투구'],imp:{hp:20}},
  {id:'chest',n:'갑옷',bases:['사슬 갑옷','판금 갑옷','가죽 조끼','망토 갑주'],imp:{hp:25,armor:6}},
  {id:'gloves',n:'장갑',bases:['건틀릿','가죽 장갑','비늘 장갑'],imp:{atk:2,armor:3}},
  {id:'boots',n:'장화',bases:['철장화','여행자 장화','그림자 장화'],imp:{armor:6,hp:10}},
  {id:'ring',n:'반지',bases:['은반지','흑요석 반지','루비 반지','뼈 반지'],imp:{},extra:1},
  {id:'amulet',n:'목걸이',bases:['부적','성물 목걸이','송곳니 목걸이'],imp:{},extra:1},
];

function skP(id){const sk=SKMAP[id],L=S.skills[id]||1,P=Object.assign({cd:sk.cd},sk.p);
  if('mult' in P)P.mult*=1+0.15*(L-1);if(sk.lvl)sk.lvl(P,L);
  const ch=(S.br&&S.br[id])||[],mods=[];
  (sk.br||[]).forEach((tier,ti)=>{const o=tier.find(x=>x.id===ch[ti]);if(o&&L>=BR_LV[ti]){mods.push(...o.m);if(o.fxcol)P.fxcol=o.fxcol;}});
  const lf=RT.cs&&RT.cs.legFx;if(lf)for(const f of lf)if(f.skill===id||(f.tag&&sk.tags.includes(f.tag))||(f.branch&&ch.includes(f.branch)))mods.push(f);
  if(S.sock)for(const gm of gemMods(id)){mods.push(...gm.mods);if(gm.g.fxcol)P.fxcol=gm.g.fxcol;}
  for(const m of mods){if(m.has&&P[m.k]===undefined)continue;if(m.set!==undefined)P[m.k]=m.set;if(m.add)P[m.k]=(P[m.k]||0)+m.add;if(m.mul)P[m.k]=(P[m.k]||0)*m.mul;}
  return P;}

function drOf(a,st){return Math.min(0.8,a/(a+40*sc(st)));}
function calc(eq){
  eq=eq||S.eq;
  const t={atk:0,hp:0,armor:0,atkPct:0,hpPct:0,armorPct:0,aspd:0,crit:5,critDmg:50,leech:0,skillDmg:0,cdr:0,bossDmg:0,gold:0,mf:0,regen:0};
  const legs=new Set();
  for(const T of TALENTS)t[T.k]+=(S.tal[T.id]||0)*T.v;
  for(const sid in eq){const it=eq[sid];if(!it)continue;const m=1+0.1*(it.enh||0);
    for(const k in it.imp)t[k]+=it.imp[k]*m;
    for(const a of it.aff)t[a.k]+=AFF[a.k].flat?a.v*m:a.v;
    if(it.leg)legs.add(it.leg);}
  const sets=setCounts(eq),f={dmgTaken:1,reflect:0,critHeal:0,bossTime:0,cdReset:0,bossReset:false,leechMult:1,killHeal:0,blast:0};
  for(const id in sets)for(const tier of [2,4])if(sets[id]>=tier)SETS[id].bonus[tier].apply(t,f);
  const c={legs,sets};Object.assign(c,f);
  c.legFx=[];for(const k of legs)if(LEG_FX[k])c.legFx.push(...LEG_FX[k]);
  c.hp=(80+S.lvl*4+t.hp)*(1+t.hpPct/100);if(legs.has('giant'))c.hp*=1.3;
  c.atk=(5+S.lvl*0.5+t.atk)*(1+t.atkPct/100);if(legs.has('giant'))c.atk+=c.hp*0.03;
  c.armor=t.armor*(1+t.armorPct/100);
  c.aspd=Math.min(5,1+t.aspd/100);
  c.crit=Math.min(75,t.crit);c.critDmg=t.critDmg;
  c.leech=t.leech*(legs.has('bloodthirst')?2:1)*f.leechMult;
  c.skillDmg=t.skillDmg;c.bossDmg=t.bossDmg;
  c.cdMult=Math.max(0.4,1-t.cdr/100)*(legs.has('timewarp')?0.75:1);
  c.gold=t.gold+(legs.has('midas')?100:0);c.mf=t.mf;c.regen=1.5+t.regen;
  c.dps=c.atk*c.aspd*(1+c.crit/100*c.critDmg/100);

}

  H.hp=clamp(H.hp,0,RT.cs.hp);dirty('equip','header','tabs');}

function rollAff(k,ilvl,rar){const a=AFF[k];const q=R(rar===3?0.5:0,1);

function genItem(ilvl,rar,setId){

  const slot=setId?SLOTMAP[pick(SETS[setId].parts)]:leg&&LEG[leg].slot?SLOTMAP[LEG[leg].slot]:pick(SLOTS);if(setId)rar=4;
  const it={id:S.nextId++,slot:slot.id,base:pick(slot.bases),rarity:rar,ilvl,imp:{},aff:[],leg:null,enh:0,lock:false};
  for(const k in slot.imp)it.imp[k]=slot.imp[k]*sc(ilvl)*R(.85,1.15);
  const n=[0,RI(1,2),RI(3,4),4,4][rar]+(slot.extra?1:0);
  for(const k of shuffle(Object.keys(AFF)).slice(0,n))it.aff.push({k,v:rollAff(k,ilvl,rar)});

}

// 자동 장착: 지금보다 5% 넘게 강하면 바로 입음. 벗은 장비는 가방으로 (가방이 차면 분해, 전설·세트·잠금 제외)

// ---- 정리 규칙 ----
// 우선순위: 잠금 > 남기기 옵션 > 도감 새 조각 > 분해 규칙(중복 세트·약한 장비) > 등급별 자동 분해
function hasKeepAff(it){const K=S.sort.keep;return K.length>0&&it.aff.some(a=>K.includes(a.k));}
function setRival(it){for(const x of [...Object.values(S.eq),...S.inv]){if(!x||x===it||x.set!==it.set||x.slot!==it.slot)continue;
  if(x.ilvl>it.ilvl||(x.ilvl===it.ilvl&&(Object.values(S.eq).includes(x)||x.id<it.id)))return x;}return null;}
function salvReason(it,o){ // o.pickup: 주울 때(등급별 자동 분해 포함), o.fresh: 도감에 처음 들어온 조각
  if(it.lock||hasKeepAff(it))return null;
  if(it.set&&o.fresh)return null;
  const R=S.sort;
  if(R.dup&&it.set&&setRival(it))return 'dup';
  if(R.weak&&!it.set&&RT.cs&&it.rarity<=(o.pickup?R.weakTo:2)&&upgradeScore(it)<1)return 'weak';
  if(o.pickup&&it.rarity<3&&S.autoSalv[it.rarity])return 'grade';
  return null;
}
// 가방 정리: 잠금·전설·남기기·세트 첫 조각은 손대지 않음 (전설은 「전설까지」여도 주울 때만 판정)
function sortSweep(manual){
  let n=0,m=0;const keep=[];
  for(const it of S.inv){const r=it.rarity===3?null:salvReason(it,{pickup:false});if(r){n++;m+=salvVal(it);}else keep.push(it);}
  S.inv=keep;S.stones+=m;
  if(manual)toast(n?`정리: ${n}개 분해 · ◆${fmt(m)}`:'정리할 장비가 없습니다',1);else{RT.sortAgg.n+=n;RT.sortAgg.m+=m;}
  if(n)dirty('equip','header','tabs');return n;

function sortTick(dt){RT.sortT+=dt;if(RT.sortT<30)return;RT.sortT=0;if(S.sort.on)sortSweep(false);
  const A=RT.sortAgg;if(A.n){log(`<span style="color:#9fd8ff">자동 정리: ${A.n}개 분해, 마력석 +${fmt(A.m)}</span>`);A.n=0;A.m=0;}}
function addLoot(it){
  lootBeam(it);
  if(it.leg&&LEG[it.leg]&&!S.legSeen[it.leg]){S.legSeen[it.leg]=1;log(`<span class="c3">전설 도감에 새 전설: ${esc(LEG[it.leg].n)}</span>`);}
  let fresh=false;if(it.set){fresh=!(S.setSeen[it.set]&&S.setSeen[it.set][it.slot]);markSeen(it);if(fresh)log(`<span class="c4">세트 도감에 새 조각: ${esc(SETS[it.set].n)} · ${SLOTMAP[it.slot].n}</span>`);}
  if(tryAutoEquip(it))return;
  const why=salvReason(it,{pickup:true,fresh});
  if(why){const v=salvVal(it);S.stones+=v;if(why!=='grade'){RT.sortAgg.n++;RT.sortAgg.m+=v;}dirty('header');return;}
  if(S.inv.length>=INV_MAX&&it.rarity>=3){ // 가방이 차도 전설·세트는 지키고, 가장 약한 일반~희귀를 대신 분해
    let vi=-1,vs=1e9;S.inv.forEach((x,i)=>{if(x.rarity<3&&!x.lock){const v=x.rarity*10+upgradeScore(x);if(v<vs){vs=v;vi=i;}}});
    if(vi>=0){const v=S.inv.splice(vi,1)[0];S.stones+=salvVal(v);}}
  if(S.inv.length>=INV_MAX&&it.rarity<3){S.stones+=salvVal(it);log(`가방이 가득 차 <span class="c${it.rarity}">${esc(it.name)}</span> 자동 분해`);dirty('header');return;}
  S.inv.push(it);dirty('equip','tabs');
  log(`획득: <span class="c${it.rarity}">${esc(it.name)}</span> <small>(${SLOTMAP[it.slot].n} · ${it.ilvl})</small>`);
  if(it.rarity===3){toast(`전설 획득! 「${esc(it.name)}」`);RT.flash=1;}
  if(it.rarity===4){toast(`<span class="c4">세트 획득 「${esc(it.name)}」</span>`,1);}
}

function spawnPack(){

  if(RT.boss){RT.enemies.push(mkEnemy(BOSSES[regionIdx(st)],320*s,3*s*2.2,true,0,1));RT.bossMax=RT.bossT=BOSS_TIME+RT.cs.bossTime;
    if(RT.cs.bossReset)for(const k in RT.cds)RT.cds[k]=0;return;}
  let n=1;if(Math.random()<Math.min(0.7,st*0.05))n++;if(Math.random()<Math.min(0.5,st*0.025))n++;
  for(let i=0;i<n;i++)RT.enemies.push(mkEnemy(pick(rg.mons),30*s*R(.9,1.1),3*s*R(.9,1.1),false,i,n));
}
const alive=()=>RT.enemies.filter(e=>!e.dead);
const HX=0.22,HY=0.72;
function text(x,y,t,col,size){if(RT.texts.length>45)RT.texts.shift();RT.texts.push({x:x+R(-.02,.02),y,t,col,size:size||13,life:1});}
function fxRing(x,y,col,r){RT.fx.push({k:'ring',x,y,col,r,life:1});}
function dealDmg(e,base,skill){
  if(!e||e.dead)return;const C=RT.cs,H=RT.hero;
  let d=base;if(skill)d*=1+C.skillDmg/100;if(e.boss)d*=1+C.bossDmg/100;
  if(C.legs.has('berserk')&&H.hp<C.hp*0.5)d*=1.25;
  if(RT.cry>0)d*=1+RT.cryV;
  let crit=false;if(Math.random()<C.crit/100){d*=1+C.critDmg/100;crit=true;RT.shake=Math.max(RT.shake,0.12);
    if(C.legs.has('critstorm'))for(const k in RT.cds)RT.cds[k]=Math.max(0,RT.cds[k]-0.2);
    if(C.critHeal)H.hp=Math.min(C.hp,H.hp+C.hp*C.critHeal);}
  d*=R(.92,1.08);e.hp-=d;e.flash=0.12;
  const lf=C.leech+(RT.cry>0?RT.cryLeech*100:0);if(lf>0)H.hp=Math.min(C.hp,H.hp+Math.min(d*lf/100,C.hp*0.08));
  text(e.x,e.y-0.2,fmt(d)+(crit?'!':''),crit?'#ffd65c':skill?'#9fd8ff':'#f2e8d8',crit?17:13);
  if(!e.boss&&e.hp>0&&C.legs.has('executioner')&&e.hp<e.max*0.15){e.hp=0;text(e.x,e.y-0.3,'처형','#ff8a3d',14);}
  if(e.hp<=0)kill(e);
}
function kill(e){
  e.dead=true;const st=S.stage,s=sc(st),C=RT.cs;RT.lastKillX=e.x;
  if(e.burn&&e.burn.spread&&e.burn.t>0)alive().forEach(x=>burnE(x,e.burn.frac,e.burn.t,true));
  RT.fx.push({k:'puff',x:e.x,y:e.y,col:region(st).col,r:e.boss?0.16:0.07,life:1});if(e.boss)RT.shake=Math.max(RT.shake,0.5);
  if(C.killHeal&&RT.hero.dead<=0){const h=C.hp*C.killHeal;RT.hero.hp=Math.min(C.hp,RT.hero.hp+h);}
  S.stats.kills++;RT.winK++;
  gainXp(4*s*(e.boss?10:1));
  const g=2*s*(1+C.gold/100)*(e.boss?12:1);S.gold+=g;
  if(e.boss){
    for(let i=0;i<3;i++)addLoot(rollDrop(st+2,4,true));
    if(Math.random()<0.4)addGem(rollGemR(2),'보스');
    S.stats.bosses++;RT.boss=false;RT.deathStreak=0;
    const first=st>=S.maxStage;S.maxStage=Math.max(S.maxStage,st+1);
    log(`<b style="color:#f0d49a">${e.name} 처치!</b> ${first?'새 스테이지가 열렸습니다.':''}`);
    S.kills=0;if(S.autoPush&&S.stage<S.maxStage)S.stage++;
    dirty('stage');recalc();
  }else{
    let drops=Math.random()<0.24?1:0;if(C.legs.has('midas')&&Math.random()<0.05)drops++;
    for(let i=0;i<drops;i++)addLoot(rollDrop(st+(Math.random()<0.3?1:0),1,false));
    if(Math.random()<0.012)addGem(rollGemR(1));
    S.kills++;
    if(S.kills>=KILLS_PER_STAGE){RT.deathStreak=0;
      if(S.autoPush){
        if(S.stage<S.maxStage){S.stage++;S.kills=0;recalc();}
        else if(!RT.boss){RT.wantBoss=true;}
      }
    }

  }
  dirty('header');
}
function gainXp(x){S.xp+=x;let up=false;
  while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;up=true;
    log(`<b style="color:#c9a8ff">레벨 업! Lv ${S.lvl}</b> — 특성 포인트 +1`);
    for(const sk of SKILLS)if(sk.lv<=S.lvl&&!S.skills[sk.id]){S.skills[sk.id]=1;
      const i=S.slots.findIndex((x,j)=>!x&&j<slotCount());if(i>=0)S.slots[i]=sk.id;
      log(`새 스킬 습득: <b style="color:#9fd8ff">${sk.n}</b>`);toast(`새 스킬: ${sk.n}`,1);dirty('skillbar','skills');}
  }

}
const xpNeed=l=>Math.floor(20*Math.pow(1.17,l-1)+l*10);
function startBoss(){if(RT.boss||S.stage<S.maxStage)return;RT.boss=true;RT.wantBoss=false;RT.enemies=[];RT.spawnT=0.4;log(`<span style="color:#ff9d8a">보스 도전 — ${BOSSES[regionIdx(S.stage)]}</span>`);dirty('stage');}
function heroDie(){
  const H=RT.hero;H.dead=2.5;H.hp=0;S.stats.deaths++;RT.deathStreak++;resetSkillFx();
  if(RT.boss){RT.boss=false;log('<span style="color:#ff8b7d">보스 도전 실패. 다시 사냥을 시작합니다.</span>');}

  if(S.autoPush&&RT.deathStreak>=2&&S.stage>1){S.stage--;RT.deathStreak=0;log(`한 단계 후퇴: ${stageName(S.stage)}`);recalc();}
  dirty('stage');

// ---- 스킬 시전 (v0.5) ----
function healHero(h){const H=RT.hero,C=RT.cs;if(h>0&&H.dead<=0)H.hp=Math.min(C.hp,H.hp+h);}
function setGuard(red,t,refl){const g=RT.guard;RT.guard={red:Math.max(red,g.t>0?g.red:0),t:Math.max(t,g.t),refl:Math.max(refl||0,g.t>0?g.refl:0)};}
function burnE(e,frac,t,spread){if(!e||e.dead||frac<=0)return;const dps=RT.cs.atk*frac*(1+RT.cs.skillDmg/100);
  if(!e.burn||e.burn.t<=0||e.burn.dps<dps)e.burn={dps,t,frac,spread:!!spread};else{e.burn.t=Math.max(e.burn.t,t);e.burn.spread=e.burn.spread||!!spread;}}
// 한 대 때리고 부가 효과(기절·화상·밀침)를 붙임. 실제로 깎은 생명력을 돌려줌(흡혈 계산용)
function hitE(e,dmg,P){if(!e||e.dead)return 0;const before=Math.max(0,e.hp);dealDmg(e,dmg,true);
  if(P){if(P.stun&&!e.dead)e.stun=Math.max(e.stun||0,P.stun);if(P.burn)burnE(e,P.burn,P.burnT||3,P.spread);if(P.knock&&!e.dead)e.atkT+=P.knock;}
  const dealt=before-Math.max(0,e.dead?0:e.hp),Q=RT.curP;
  if(Q){ // 보조 젬 공통 효과
    if(!e.dead){if(Q.gStun)e.stun=Math.max(e.stun||0,Q.gStun);if(Q.gBurn)burnE(e,Q.gBurn,3);if(Q.gSlow)RT.slowT=Math.max(RT.slowT,Q.gSlow);}
    if(Q.gLeech)healHero(dealt*Q.gLeech);
    if(Q.gBoom&&e.dead&&!RT.inBoom){RT.inBoom=1;RT.fx.push({k:'burst',x:e.x,y:e.y-.06,col:'#ffb04a',life:1});alive().forEach(o=>hitE(o,RT.cs.atk*Q.gBoom,null));RT.inBoom=0;}}
  return dealt;}
// 언제 쓸지: 회복은 생명력 기준, 처형은 약한 적이 있거나 보스일 때, 광역은 거의 죽은 적 하나에 낭비하지 않음, 지속형은 겹쳐 쓰지 않음
function wantCast(id,P,en){const H=RT.hero,C=RT.cs,sk=SKMAP[id];
  if(id==='blood')return H.hp<=C.hp*P.gate;
  if(!en.length)return false;
  const boss=en.some(e=>e.boss),w=RT.wait[id]||0;
  if(id==='execute')return boss||en.some(e=>e.hp/e.max<P.thresh)||w>3;
  if(id==='storm'&&RT.storm.t>0)return false;
  if(id==='clone'&&RT.clones.length)return false;
  if(id==='shield'&&RT.guard.t>1&&!boss)return false;
  if(sk.tags.includes('aoe')&&!boss&&en.length===1&&en[0].hp/en[0].max<.35&&w<2)return false;
  return true;}
function cast(id,scale){RT.curP=null;const P0=skP(id);
  if(scale){for(const k of ['mult','burn','after'])if(P0[k])P0[k]*=scale;P0.gRepeat=0;}
  RT.curP=P0;const ok=castInner(id,P0);RT.curP=null;
  if(ok&&P0.gRepeat&&!scale)RT.recast.push({id,t:.4,scale:P0.gRepeat});
  return ok;}
function castInner(id,P){
  const C=RT.cs,H=RT.hero,en=alive(),sk=SKMAP[id],col=P.fxcol||sk.fx.col,A=C.atk,front=en[0];
  const fx=(o,k)=>RT.fx.push(Object.assign({k:k||sk.fx.t,col,life:1},o));
  if(!en.length&&id!=='blood')return false;
  switch(id){
    case 'smash':for(let h=0;h<P.hits;h++){hitE(front,A*P.mult,P);if(P.splash)alive().slice(1).forEach(e=>hitE(e,A*P.mult*P.splash,null));}
      fx({x:front.x,y:front.y-.08});if(P.after)RT.pend.push({t:1,mult:P.after,k:'burst',col:'#ff9a3a',leech:0,P});break;
    case 'whirl':for(let h=0;h<P.hits;h++){let d=0;alive().forEach(e=>{d+=hitE(e,A*P.mult,P);});if(P.leech)healHero(d*P.leech);}
      fx({x:HX,y:HY-.02,r:.22});if(P.hits>1)fx({x:HX,y:HY-.02,r:.17,life:.7});break;
    case 'chain':{const pts=[{x:HX,y:HY-.1}];for(let i=0;i<P.hits;i++){const a=alive();if(!a.length)break;const e=pick(a);pts.push({x:e.x,y:e.y-.08});hitE(e,A*P.mult*(P.lastx2&&i===P.hits-1?2:1),P);}
      fx({pts});break;}
    case 'frost':for(let h=0;h<P.hits;h++)alive().forEach(e=>hitE(e,A*P.mult,P));RT.slowT=Math.max(RT.slowT,P.slow);if(P.guard)setGuard(P.guard,4);
      fx({x:.73,y:.74,r:.3});break;
    case 'blood':{if(H.hp>C.hp*P.gate)return false;const h=C.hp*P.heal;healHero(h);text(HX,HY-.25,'+'+fmt(h),'#74d083',15);
      if(P.guard)setGuard(P.guard,5);if(P.regen)RT.regenB={t:5,rate:P.regen};fx({x:HX,y:HY-.08});break;}
    case 'cry':RT.cry=P.dur;RT.cryV=P.val;RT.cryLeech=P.leech||0;if(P.stun)en.forEach(e=>{e.stun=Math.max(e.stun||0,P.stun);});
      text(HX,HY-.3,'전투 함성!','#ffb35c',14);fx({x:HX+.03,y:HY-.1});break;
    case 'execute':{const ord=en.slice().sort((a,b)=>a.hp/a.max-b.hp/b.max);
      for(const e of ord.slice(0,P.targets)){const m=P.mult*(e.hp/e.max<P.thresh?P.execx:1)*(e.boss?P.bossMult:1);fx({x:e.x,y:e.y-.04});hitE(e,A*m,null);if(P.reset&&e.dead)RT.resetNow=id;}break;}
    case 'leap':for(let h=0;h<P.hits;h++)alive().forEach(e=>hitE(e,A*P.mult,P));if(P.guard)setGuard(P.guard,3);
      fx({x:.72,y:.74});fx({x:.72,y:.76,r:.32},'ring');RT.shake=Math.max(RT.shake,.3);break;
    case 'vamp':{let d=0;(P.targets>1?en:[front]).forEach(e=>{d+=hitE(e,A*P.mult,null);});const h=Math.min(d*P.leech,C.hp*P.cap);healHero(h);
      if(h>0)text(HX,HY-.25,'+'+fmt(h),'#74d083',13);fx({x:front.x,y:front.y-.04});break;}
    case 'fire':alive().forEach(e=>hitE(e,A*P.mult,{burn:P.burn,burnT:P.burnT,spread:P.spread}));en.forEach(e=>fx({x:e.x,y:e.y-.06}));break;
    case 'storm':RT.storm={t:P.dur,tick:P.tick,acc:0,mult:P.mult,col,P};if(P.guard)setGuard(P.guard,P.dur);fx({x:HX,y:HY-.02,r:.2});break;
    case 'fissure':{for(let h=0;h<P.hits;h++){let i=0;for(const e of alive()){hitE(e,A*P.mult*(1+P.grow*i),P);i++;}}fx({x:HX+.04,y:HY+.06,x2:en[en.length-1].x+.04});break;}
    case 'clone':RT.clones=Array.from({length:P.count},(_,i)=>({t:P.dur,acc:-i*.3,rate:P.rate,mult:P.mult,leech:P.leech||0,i,P}));fx({x:HX+.07,y:HY-.04,r:.12});break;
    case 'shield':hitE(front,A*P.mult,null);(P.knockAll?en:[front]).forEach(e=>{if(!e.dead)e.atkT+=P.knock;});setGuard(P.guard,P.guardT,P.refl);
      fx({x:front.x-.05,y:front.y-.06});RT.shake=Math.max(RT.shake,.15);break;
    case 'rift':for(let i=0;i<P.count;i++){const d=P.delay+i*.7;RT.pend.push({t:d,mult:P.mult,k:'rift',col,leech:P.leech||0,P});fx({x:.73,y:.7,life:1,spd:1/d},'riftOpen');}break;
  }
  return true;
}
// 시간이 걸리는 효과들: 지연 폭발, 칼날 폭풍, 분신, 방어, 재생, 적의 기절·화상
function tickSkillFx(dt){
  const C=RT.cs,g=RT.guard;if(g.t>0)g.t-=dt;
  if(RT.regenB.t>0){RT.regenB.t-=dt;healHero(C.hp*RT.regenB.rate*dt);}
  for(let i=RT.pend.length-1;i>=0;i--){const p=RT.pend[i];p.t-=dt;if(p.t>0)continue;RT.pend.splice(i,1);
    RT.curP=p.P||null;let d=0;alive().forEach(e=>{d+=hitE(e,C.atk*p.mult,null);});RT.curP=null;if(p.leech)healHero(d*p.leech);
    RT.fx.push({k:p.k,x:.73,y:.7,col:p.col,r:.3,life:1});RT.shake=Math.max(RT.shake,.25);}
  const st=RT.storm;if(st.t>0){st.t-=dt;st.acc+=dt;while(st.acc>=st.tick){st.acc-=st.tick;const a=alive();if(!a.length)break;RT.curP=st.P||null;a.forEach(e=>hitE(e,C.atk*st.mult,null));RT.curP=null;
    if(Math.random()<.5)RT.fx.push({k:'spin',x:HX,y:HY-.02,r:.16,col:st.col,life:.6});}}
  for(let i=RT.clones.length-1;i>=0;i--){const c=RT.clones[i];c.t-=dt;if(c.t<=0){RT.clones.splice(i,1);continue;}c.acc+=dt;
    if(c.acc>=c.rate){c.acc-=c.rate;c.anim=.22;const e=alive()[0];if(e){RT.curP=c.P||null;const d=hitE(e,C.atk*c.mult,null);RT.curP=null;if(c.leech)healHero(d*c.leech);}}if(c.anim>0)c.anim-=dt;}
  for(let i=RT.recast.length-1;i>=0;i--){const r=RT.recast[i];r.t-=dt;if(r.t>0)continue;RT.recast.splice(i,1);if(alive().length)cast(r.id,r.scale);}
  for(const e of RT.enemies){if(e.dead)continue;if(e.stun>0)e.stun-=dt;
    if(e.burn&&e.burn.t>0){e.burn.t-=dt;e.hp-=e.burn.dps*dt;if(e.hp<=0&&!e.dead)kill(e);}}
}
function resetSkillFx(){RT.recast=[];RT.curP=null;RT.pend=[];RT.storm={t:0};RT.clones=[];RT.guard={red:0,t:0,refl:0};RT.regenB={t:0,rate:0};RT.wait={};}

function step(dt){
  const C=RT.cs,H=RT.hero;S.stats.time+=dt;sortTick(dt);
  RT.winT+=dt;if(RT.winT>=15){const r=RT.winK/RT.winT;S.killRate=S.killRate?S.killRate*0.7+r*0.3:r;RT.winT=0;RT.winK=0;}
  if(H.dead>0){H.dead-=dt;if(H.dead<=0){H.hp=C.hp;RT.spawnT=0.4;}return;}
  if(RT.wantBoss&&!RT.boss&&!alive().length)startBoss();
  if(!alive().length){if(RT.enemies.length)H.hp=Math.min(C.hp,H.hp+C.hp*0.1);RT.enemies=[];RT.spawnT-=dt;if(RT.spawnT<=0){spawnPack();RT.spawnT=0.55;}}
  if(RT.boss&&alive().length){RT.bossT-=dt;if(RT.bossT<=0){RT.boss=false;RT.enemies=[];S.kills=0;RT.wantBoss=false;log('<span style="color:#ff8b7d">제한 시간 초과 — 보스가 사라졌습니다. 더 강해져서 돌아오세요.</span>');dirty('stage');}}
  if(C.regen>0)H.hp=Math.min(C.hp,H.hp+C.hp*C.regen/100*dt);
  if(RT.cry>0)RT.cry-=dt;if(RT.slowT>0)RT.slowT-=dt;
  tickSkillFx(dt);if(H.dead>0)return;
  const en=alive();
  if(en.length){
    let as=C.aspd;if(C.legs.has('berserk')&&H.hp<C.hp*0.5)as*=1.5;
    H.atkT-=dt*as;
    if(H.atkT<=0){H.atkT+=1;H.anim=0.22;RT.fx.push({k:'swing',x:HX,y:HY+.02,life:1});const e=en[0];dealDmg(e,C.atk,false);
      if(C.legs.has('flameblade')&&Math.random()<0.2){alive().forEach(x=>dealDmg(x,C.atk*1.5,false));fxRing(e.x,e.y-.08,'#ff8a3d',.16);}
      if(C.blast&&Math.random()<C.blast&&alive().length){alive().forEach(x=>dealDmg(x,C.atk*1.2,false));fxRing(e.x,e.y-.08,'#ff5a2a',.2);RT.shake=Math.max(RT.shake,0.2);}}
  }
  for(let i=0;i<slotCount();i++){const id=S.slots[i];if(!id||!S.skills[id])continue;
    if(RT.cds[id]===undefined)RT.cds[id]=skillCd(id)*0.4;
    RT.cds[id]-=dt;if(RT.cds[id]>0)continue;RT.cds[id]=0;
    const en2=alive(),P=skP(id);
    if(!wantCast(id,P,en2)){RT.wait[id]=(RT.wait[id]||0)+dt;continue;}
    RT.wait[id]=0;
    if(cast(id)){RT.cds[id]=skillCd(id);if(C.cdReset&&Math.random()<C.cdReset)RT.cds[id]=0.3;if(RT.resetNow===id){RT.cds[id]=0.3;RT.resetNow=null;}
      if(C.legs.has('echo')&&Math.random()<0.3&&alive().length){cast(id);text(HX,HY-.34,'메아리','#ff8a3d',12);}}
    else RT.cds[id]=0.25;
  }
  const dr=drOf(C.armor,S.stage);
  for(const e of alive()){
    let sp=1;if(RT.slowT>0)sp*=0.6;if(C.legs.has('frostheart'))sp*=0.75;
    if(e.stun>0)continue;
    e.atkT-=dt*0.8*sp;
    if(e.atkT<=0){e.atkT+=1;e.anim=0.3;const d=e.atk*R(.9,1.1)*(1-dr)*C.dmgTaken*(RT.guard.t>0?1-RT.guard.red:1);H.hp-=d;H.hit=0.15;if(e.boss)RT.shake=Math.max(RT.shake,0.25);
      const rf=(C.legs.has('thorns')?0.6:0)+C.reflect+(RT.guard.t>0?RT.guard.refl:0);if(rf>0){e.hp-=d*rf;if(e.hp<=0)kill(e);}
      if(H.hp<=0){heroDie();return;}}
  }
  RT.enemies=RT.enemies.filter(e=>!e.dead||false);
}

  if(!LO){LO=document.createElement('canvas');lx=LO.getContext('2d');}
  if(w!==LW||h!==LH){LW=w;LH=h;LO.width=w;LO.height=h;lx.imageSmoothingEnabled=false;for(const k in CACHE)delete CACHE[k];}}

const _rgb={};function rgb(c){if(_rgb[c])return _rgb[c];const n=parseInt(c.slice(1,7),16);return _rgb[c]=[n>>16&255,n>>8&255,n&255];}
const css=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const lit=(a,k)=>k>0?a.map(v=>v+(255-v)*k):a.map(v=>v*(1+k));
const mixc=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
function G(rows){const w=Math.max(...rows.map(r=>r.length));return rows.map(r=>r.padEnd(w,'.').split(''));}
function blank(w,h){return Array.from({length:h},()=>Array(w).fill('.'));}
function compose(w,h,layers){const o=blank(w,h);for(const L of layers){const g=L.g;for(let y=0;y<g.length;y++)for(let x=0;x<g[y].length;x++){const c=g[y][x];if(c==='.')continue;const X=x+(L.x||0),Y=y+(L.y||0);if(X>=0&&Y>=0&&X<w&&Y<h)o[Y][X]=c;}}return o;}
function rot90(g){const h=g.length,w=g[0].length,o=[];for(let x=0;x<w;x++){const r=[];for(let y=h-1;y>=0;y--)r.push(g[y][x]);o.push(r);}return o;}
function rotN(g,n){for(let i=0;i<n;i++)g=rot90(g);return g;}
function scale2(g){const o=[];for(const r of g){const rr=[];for(const c of r)rr.push(c,c);o.push(rr,rr.slice());}return o;}
function findCh(g,ch){for(let y=0;y<g.length;y++){const x=g[y].indexOf(ch);if(x>=0)return[x,y];}return null;}
// 격자를 그림으로 굽기: 위쪽 가장자리는 밝게, 아래·오른쪽은 어둡게, 바깥은 1칸 테두리
function bake(g,pal,o={}){
  const h=g.length,w=g[0].length,c=document.createElement('canvas');c.width=w+2;c.height=h+2;const x=c.getContext('2d');
  const at=(X,Y)=>Y>=0&&Y<h&&X>=0&&X<w&&g[Y][X]!=='.';const flat=o.flat||'';
  for(let y=0;y<h;y++)for(let X=0;X<w;X++){const ch=g[y][X];if(ch==='.')continue;
    const base=(o.recolor&&o.recolor[ch])||pal[ch];if(!base)continue;let a=rgb(base);
    if(o.white)a=[255,255,255];
    else{if(!flat.includes(ch)){if(!at(X,y-1))a=lit(a,.25);else if(!at(X,y+1)||!at(X+1,y))a=lit(a,-.3);}
      if(o.hurt)a=mixc(a,[255,70,50],.45);if(o.dim)a=lit(a,-o.dim);}
    x.fillStyle=css(a);x.fillRect(X+1,y+1,1,1);}
  const gl=o.glow;
  for(let y=-1;y<=h;y++)for(let X=-1;X<=w;X++){if(at(X,y))continue;
    const nb=[[X-1,y],[X+1,y],[X,y-1],[X,y+1]].filter(([a,b])=>at(a,b));if(!nb.length)continue;
    x.fillStyle=gl&&nb.some(([a,b])=>gl.chars.includes(g[b][a]))?gl.col:(o.white?'#ffffff':'#0b0807');x.fillRect(X+1,y+1,1,1);}
  return c;
}

function swordGrid(){const g=blank(13,13);
  for(let i=0;i<7;i++){g[8-i][5+i]='b';g[8-i][6+i]='B';}g[1][12]='B';
  g[8][3]='y';g[9][4]='y';g[10][5]='y';g[10][3]='h';g[11][2]='y';return g;}
const SWORD=swordGrid();
// pose: sw=검 방향(0 위오른쪽, 1 아래오른쪽, 3 위왼쪽), under=몸 뒤로, head=머리 들썩, kneel=무릎
function heroGrid(p){
  const W0=40,H0=40,BX=11,BY=14;let body=HERO_BODY;
  if(p.head)body=compose(18,22,[{g:HERO_BODY.slice(8),y:8},{g:HERO_BODY.slice(0,8),y:1}]);
  if(p.kneel)body=compose(18,22,[{g:HERO_BODY.slice(0,16),y:3},{g:KNEEL_LEGS,y:19}]);
  const L=[];let sw=null;
  if(p.sw!=null){const sg=rotN(SWORD,p.sw),[hx,hy]=findCh(sg,'h');sw={g:sg,x:BX+13-hx,y:BY+12+(p.kneel?3:0)-hy};}
  if(sw&&p.under)L.push(sw);L.push({g:body,x:BX,y:BY});if(sw&&!p.under)L.push(sw);
  let g=compose(W0,H0,L),ax=BX+9,ay=BY+22;
  if(p.lying){g=rot90(compose(W0,H0,[{g:HERO_BODY,x:BX,y:BY}]));ax=W0-(BY+11);ay=BX+18;}
  // 빈 가장자리 잘라내기
  let x0=99,y0=99,x1=-1,y1=-1;g.forEach((r,y)=>r.forEach((c,x)=>{if(c!=='.'){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}}));
  g=g.slice(y0,y1+1).map(r=>r.slice(x0,x1+1));if(p.lying)return{g,ax:Math.round(g[0].length/2)+1,ay:g.length+1};return{g,ax:ax-x0+1,ay:ay-y0+1};
}
const HERO_POSES={idle0:{sw:0},idle1:{sw:0,head:1},sw0:{sw:3,under:1},sw1:{sw:0},sw2:{sw:1},hurt:{sw:0},dead0:{sw:1,kneel:1},dead1:{lying:1}};
function heroSprite(pose,glowCol,capeCol,hurt){
  return cached(`H|${pose}|${glowCol}|${capeCol}|${hurt}`,()=>{const hg=heroGrid(HERO_POSES[pose]||HERO_POSES.idle0);

}

function monGrid(ri,boss,frame){const M=MON[ri];let g=G(M.g);

// ---- 도트 도형 ----
function pxDot(x,y){lx.fillRect(Math.round(x),Math.round(y),1,1);}
function pxLine(x0,y0,x1,y1){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,n=0;
  while(n++<400){lx.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function pxEll(cx,cy,rx,ry,a0=0,a1=6.2832){const n=Math.max(12,Math.round((rx+ry)*3));for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;pxDot(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry);}}
function pxEllFill(cx,cy,rx,ry){for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(1-(y*y)/(ry*ry)));lx.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1);}}
function pxStar(cx,cy,len,from){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1],[.7,.7],[-.7,.7],[.7,-.7],[-.7,-.7]])for(let k=from;k<=len*(dx&&dy?.75:1);k++)pxDot(cx+dx*k,cy+dy*k*.8);}

const FXSPD={beam:.8,puff:1.8,spin:2,nova:2,heal:1.4,shout:1.8,swing:4.5};
const fr=(t,n)=>Math.min(n-1,Math.floor(t*n));
const FXR={
  impact(f,X,Y,t){const i=fr(t,4);lx.fillStyle=f.col;pxStar(X,Y,[2,5,7,8][i],i>1?i*2-2:0);
    if(i>=1){lx.fillStyle=i>=3?f.col+'88':f.col;pxEll(X,Y,[0,3,6,8][i],[0,2,4,6][i]);}
    if(i<2){lx.fillStyle='#fff';lx.fillRect(X-1,Y-1,3,3);}},
  spin(f,X,Y,t){const R=Math.max(10,Math.round(f.r*LW*.8)),i=fr(t,5),a0=i*1.25;
    for(let k=0;k<3;k++){lx.fillStyle=k===0?'#ffffff':k===1?f.col:f.col+'77';pxEll(X,Y,R-k*2,(R-k*2)*.42,a0-k*.5,a0-k*.5+2.6);}},
  bolt(f,X,Y,t){if(!f.pts)return;const flick=Math.floor(t*14)%2;
    for(let p=1;p<f.pts.length;p++){const a=f.pts[p-1],b=f.pts[p];let px=a.x*LW,py=a.y*LH;const ex=b.x*LW,ey=b.y*LH,n=6;
      for(let s=1;s<=n;s++){const nx=px+(ex-a.x*LW)/n,ny=py+(ey-a.y*LH)/n+(s<n?R(-3,3):0);
        lx.fillStyle=f.col;pxLine(px,py-1,nx,ny-1);pxLine(px,py+1,nx,ny+1);lx.fillStyle=flick?'#ffffff':'#dff4ff';pxLine(px,py,nx,ny);px=nx;py=ny;}
      lx.fillStyle='#fff';lx.fillRect(Math.round(ex)-1,Math.round(ey)-1,3,3);}},
  nova(f,X,Y,t){const i=fr(t,4),R=Math.round(f.r*LW*.55*(i+1)/4);lx.fillStyle=f.col;pxEll(X,Y,R,R*.42);lx.fillStyle='#e8faff';pxEll(X,Y,R-2,(R-2)*.42,0,3.14);
    for(let k=0;k<8;k++){const a=k/8*6.283,sx=X+Math.cos(a)*R,sy=Y+Math.sin(a)*R*.42;lx.fillRect(Math.round(sx),Math.round(sy)-1,1,3);lx.fillRect(Math.round(sx)-1,Math.round(sy),3,1);}},
  heal(f,X,Y,t){const i=fr(t,5);for(let k=0;k<6;k++){const x=X-8+k*3.2+(k%2?1:-1),y=Y+4-i*3-(k%3)*3;lx.fillStyle=k%2?f.col:'#ff9a8a';lx.fillRect(Math.round(x),Math.round(y)-1,1,3);lx.fillRect(Math.round(x)-1,Math.round(y),3,1);}

  xslash(f,X,Y,t){const i=fr(t,4),L=[4,8,11,11][i];
    for(const s of[1,-1]){lx.fillStyle=f.col;pxLine(X-L,Y-L*s+1,X+L,Y+L*s+1);pxLine(X-L+1,Y-L*s,X+L+1,Y+L*s);lx.fillStyle=i<3?'#fff':f.col;pxLine(X-L,Y-L*s,X+L,Y+L*s);}},
  swing(f,X,Y,t){const i=fr(t,3);lx.fillStyle=['#ffffff','#e8e2d8','#a09a90'][i];pxEll(X+3,Y-6,10,10,-2.4+i*.5,.2);lx.fillStyle='#ffffff88';pxEll(X+3,Y-6,9,9,-2+i*.5,0);},
  burst(f,X,Y,t){const i=fr(t,4);lx.fillStyle=f.col;pxStar(X,Y,[3,6,8,9][i],i);lx.fillStyle='#ffe08a';if(i<2)lx.fillRect(X-1,Y-1,3,3);lx.fillStyle=f.col+'99';pxEll(X,Y,[2,5,8,10][i],[1,3,5,6][i]);},
  puff(f,X,Y,t){lx.fillStyle=f.col;const big=f.r>.1;for(let k=0;k<(big?14:8);k++){const a=k/(big?14:8)*6.283+f.r*40,d=t*(big?22:12);

  x.putImageData(im,0,0);return c;}

    const y=(t.y-(1-t.life)*0.12)*Hh;ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(t.t,t.x*W,y);ctx.fillStyle=t.col;ctx.fillText(t.t,t.x*W,y);}

  return `<div class="dexrow" style="border-left:3px solid ${SET_COL[id]}"><b style="color:${SET_COL[id]}">${SD.n}</b> <span class="wh">${got}/${SD.parts.length} · ${SD.role} · ${setWhere(id)}</span><br>
    ${SD.parts.map(p=>`<span class="pt ${seen[p]?'on':''}">${seen[p]?'✓':'·'} ${SLOTMAP[p].n}</span>`).join('')}
    <div class="wh">(2) ${SD.bonus[2].d}<br>(4) ${SD.bonus[4].d}</div></div>`;}).join('');}
function renderHeader(){
  $('#lv').textContent=S.lvl;const n=xpNeed(S.lvl);$('#xpf').style.width=(S.xp/n*100)+'%';$('#xpt').textContent=`${fmt(S.xp)} / ${fmt(n)}`;
  $('#gold').textContent=fmt(S.gold);$('#stones').textContent=fmt(S.stones);
}
function renderStage(){
  $('#sname').textContent=stageName(S.stage);
  $('#ssub').textContent=`스테이지 ${S.stage} · 최고 ${S.maxStage}${S.stage<S.maxStage?' · 클리어함':''}`;
  $('#sPrev').disabled=S.stage<=1;$('#sNext').disabled=S.stage>=S.maxStage;
  $('#autoPush').checked=S.autoPush;
  const k=Math.min(S.kills,KILLS_PER_STAGE);$('#killf').style.width=(k/KILLS_PER_STAGE*100)+'%';
  $('#killt').textContent=RT.boss?'보스전 진행 중':S.stage<S.maxStage?`${k} / ${KILLS_PER_STAGE} 처치 — ${S.autoPush?'채우면 다음 스테이지로':'파밍 중'}`:`${k} / ${KILLS_PER_STAGE} 처치 — 채우면 보스 도전 가능`;
  const bb=$('#bossBtn');bb.classList.toggle('hide',!(S.stage>=S.maxStage&&S.kills>=KILLS_PER_STAGE&&!RT.boss));
}
function renderSkillbar(){
  let h='';for(let i=0;i<MAX_SLOTS;i++){const id=S.slots[i];
    if(i>=slotCount()){h+=`<div class="sk empty">Lv ${i===3?20:40} 해금</div>`;continue;}
    if(!id){h+=`<div class="sk empty">빈 칸</div>`;continue;}
    h+=`<div class="sk" data-sk="${id}"><div class="cd"></div><span class="nm">${SKMAP[id].n}</span><span class="lvl">Lv${S.skills[id]}</span></div>`;}
  $('#skillbar').innerHTML=h;
}
function tickSkillbar(){
  document.querySelectorAll('#skillbar .sk[data-sk]').forEach(el=>{const id=el.dataset.sk;const cd=skillCd(id);const r=clamp((RT.cds[id]??0)/cd,0,1);el.firstChild.style.height=(r*100)+'%';});
  const H=RT.hero,C=RT.cs;$('#hpf').style.width=clamp(H.hp/C.hp*100,0,100)+'%';$('#hpt').textContent=`생명력 ${fmt(Math.max(0,H.hp))} / ${fmt(C.hp)}`;
}
function renderLog(){const el=$('#log');const atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-20;el.innerHTML=RT.log.map(l=>`<div>${l}</div>`).join('');if(atBottom)el.scrollTop=el.scrollHeight;}
function tpLeft(){return S.lvl-1-Object.values(S.tal).reduce((a,b)=>a+b,0);}
function countUp(){let n=0;if(RT.cs)for(const it of S.inv)if(upgradeScore(it)>1.01)n++;return RT.upCount=n;}
function sockHTML(sk,L){const s=S.sock[sk.id]||[];let h='<div class="socks"><span class="brlv">보조 젬</span>';
  for(let i=0;i<3;i++){if(L<SOCK_LV[i]){h+=`<span class="sock lockd">Lv ${SOCK_LV[i]}</span>`;continue;}
    const x=s[i]&&gemById(s[i]);
    h+=x?`<button class="sock on" data-act="unsock" data-id="${sk.id}" data-i="${i}" title="눌러서 빼기"><b style="color:${GEM_RCOL[x.r]}">${GEMMAP[x.g].n}</b><small>${gemDesc(x)}</small></button>`
       :`<button class="sock" data-act="sockpick" data-id="${sk.id}" data-i="${i}">＋ 젬 끼우기</button>`;}
  return h+'</div>';}
function gemBagHTML(){if(!S.gems.length)return `<h3>보조 젬 <span class="r">아직 없음 · 적과 보스에게서 얻어요</span></h3>`;
  const grp={};for(const x of S.gems){const k=x.g+'|'+x.r;(grp[k]||(grp[k]={g:x.g,r:x.r,all:[],free:[]})).all.push(x);if(!gemUsedBy(x.u))grp[k].free.push(x);}
  const rows=Object.values(grp).sort((a,b)=>b.r-a.r||a.g.localeCompare(b.g)).map(G=>{const x=G.all[0],g=GEMMAP[G.g];
    return `<div class="gemrow"><div class="t"><b style="color:${GEM_RCOL[G.r]}">${gemName(x)}</b> <small class="pips">×${G.all.length}${G.free.length<G.all.length?` (끼움 ${G.all.length-G.free.length})`:''}</small>
      <small style="color:var(--dim)"> · ${g.req.includes('*')?'모든 스킬':g.req.map(t=>TAGN[t]).join('·')}</small><p>${gemDesc(x)}</p></div>
      <div class="gbtns">${G.r<2?`<button data-act="gmerge" data-g="${G.g}" data-r="${G.r}" ${G.free.length<3?'disabled':''} title="안 끼운 같은 젬 3개 → 상위 등급">합성</button>`:''}<button data-act="gsalv" data-g="${G.g}" data-r="${G.r}" ${G.free.length?'':'disabled'}>분해 ◆${gemSalv(x)}</button></div></div>`;}).join('');
  return `<h3>보조 젬 <span class="r">${S.gems.length}개 · 스킬 아래 칸에 끼워요</span></h3><div class="gembag">${rows}</div>`;}
function openGemPick(id,i){const sk=SKMAP[id],s=S.sock[id]||[],inSkill=new Set(s.filter((u,j)=>u&&j!==i).map(u=>{const x=gemById(u);return x&&x.g;}));
  const cand=S.gems.filter(x=>!gemUsedBy(x.u)&&gemOk(GEMMAP[x.g],sk)&&!inSkill.has(x.g)).sort((a,b)=>b.r-a.r);
  const m=$('#modal');m.dataset.id='0';
  m.innerHTML=`<div class="mbox"><h2 style="color:#f0d49a">${sk.n} · 보조 젬 ${i+1}</h2><div class="meta">${sk.tags.map(t=>TAGN[t]).join(' · ')} 스킬에 맞는 젬만 보여요. 같은 젬은 한 스킬에 하나만.</div>
    <div class="list">${cand.length?cand.map(x=>`<button class="gempick" data-act="gset" data-id="${id}" data-i="${i}" data-u="${x.u}"><b style="color:${GEM_RCOL[x.r]}">${gemName(x)}</b><small>${gemDesc(x)}</small></button>`).join(''):'<p class="note">끼울 수 있는 젬이 없습니다.</p>'}</div>
    <div class="mbtns"><button data-act="close">닫기</button></div></div>`;m.classList.remove('hide');}
function brPending(){for(const sk of SKILLS){const L=S.skills[sk.id];if(!L||!sk.br)continue;const ch=S.br[sk.id]||[];for(let t=0;t<sk.br.length;t++)if(L>=BR_LV[t]&&!ch[t])return true;}return false;}
function renderTabs(){const up=countUp();document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===RT.tab);
  if(!b.dataset.label)b.dataset.label=b.textContent.trim();
  const dot=(b.dataset.tab==='talents'&&tpLeft()>0)||(b.dataset.tab==='skills'&&brPending());
  b.innerHTML=b.dataset.label+(dot?'<span class="dot"></span>':'')+(b.dataset.tab==='equip'&&up?`<span class="badge" title="더 좋은 장비">▲${up}</span>`:'');});}

      <div><span>평타 DPS</span><b style="color:#ffe3a6">${fmt(C.dps)}</b></div><div><span>아이템 발견</span><b>+${C.mf.toFixed(0)}%</b></div>

      <div class="filt">${[['all','전체'],['up','▲만'],['set','세트'],...SLOTS.map(s=>[s.id,s.n])].map(([k,n])=>`<button data-act="invf" data-f="${k}" class="${F===k?'on':''}">${n}${k==='up'&&RT.upCount?' '+RT.upCount:''}</button>`).join('')}</div>

  }else if(RT.tab==='skills'){
    let h=gemBagHTML()+`<h3>스킬 <span class="r">전투 중 자동 시전 · 장착 칸 ${slotCount()}개${slotCount()<MAX_SLOTS?` (Lv ${slotCount()===3?20:40}에 하나 더)`:''}</span></h3><div class="list">`;
    const order=SKILLS.slice().sort((a,b)=>(S.slots.includes(b.id)-S.slots.includes(a.id))||((!!S.skills[b.id])-(!!S.skills[a.id]))||a.lv-b.lv);
    for(const sk of order){const L=S.skills[sk.id];const tags=sk.tags.map(t=>`<span class="tag">${TAGN[t]}</span>`).join('');
      if(!L){h+=`<div class="li locked"><div class="t"><b>${sk.n}</b> <small>Lv ${sk.lv}에 습득</small> ${tags}<p>${sk.d(skP(sk.id))}</p></div></div>`;continue;}
      const P=skP(sk.id),cost=Math.ceil(40*Math.pow(1.45,L-1));
      let sb='<div class="slotbtns">';for(let i=0;i<slotCount();i++)sb+=`<button data-act="slot" data-i="${i}" data-id="${sk.id}" class="${S.slots[i]===sk.id?'on':''}">${i+1}</button>`;sb+='</div>';

      <span>사망</span><b>${fmt(st.deaths)}</b><span>최고 스테이지</span><b>${S.maxStage}</b>

      <textarea id="savebox" placeholder="저장 코드가 여기에 표시되거나, 불러올 코드를 붙여 넣으세요"></textarea>
      <h3>도움말</h3><p class="note" style="margin-top:0;font-size:12px;line-height:1.6">전투는 자동입니다. 적 10마리를 처치하면 보스에 도전할 수 있고, 보스를 30초 안에 잡으면 다음 스테이지가 열립니다.

      세트 장비(초록)는 지역마다 하나씩 나오고, 2개·4개를 모으면 세트 효과가 켜집니다 — 평원은 생존, 숲은 흡혈, 묘지는 치명타, 용암은 광역, 첨탑은 스킬, 공허는 보스 사냥. 모은 조각은 세트 도감에 기록됩니다.
      막히면 이전 스테이지로 돌아가 파밍하세요. 창을 닫아 두는 동안에도 최대 8시간까지 절반 효율로 보상이 쌓입니다.</p>`;
  }
}

function openItem(id){
  const f=findItem(id);if(!f){closeModal();return;}RT.selId=id;const it=f.it;const C=RT.cs;
  let cmp='';
  if(f.where==='inv'){const cur=S.eq[it.slot];const c1=calc(Object.assign({},S.eq,{[it.slot]:it}));
    const line=(n,a,b,fm)=>{const d=a>0?(b/a-1)*100:100;return `<div><span>${n}</span><span>${fm(a)} → ${fm(b)} <b class="${d>0.05?'pos':d<-0.05?'neg':''}">${d>=0?'+':''}${d.toFixed(1)}%</b></span></div>`;};
    cmp=`<div class="cmp"><div style="color:var(--dim);margin-bottom:3px">${cur?`장착 중: <span class="c${cur.rarity}">${esc(cur.name)}</span>`:'이 칸은 비어 있음'}</div>
      ${line('평타 DPS',C.dps,c1.dps,fmt)}${line('스킬 피해 포함 화력',C.power,c1.power,fmt)}${line('생명력',C.hp,c1.hp,fmt)}${line('실질 생존력',C.ehp,c1.ehp,fmt)}${setDiffHTML(C.sets,c1.sets)}
      <div class="note">세트 효과는 수치 비교에 포함됩니다. 전설 고유 효과와 확률 발동 효과는 들어가지 않습니다.</div></div>`;}
  const ec=enhCost(it),rc=rerollCost(it);
  const canE=(it.enh||0)<10&&S.stones>=ec.st&&S.gold>=ec.g,canR=S.stones>=rc.st&&S.gold>=rc.g;
  const h=`<div class="mbox">
    <h2 class="c${it.rarity}">${esc(it.name)}${it.enh?` +${it.enh}`:''}</h2>
    <div class="meta">${RNAME[it.rarity]} ${SLOTMAP[it.slot].n} · 아이템 레벨 ${it.ilvl}${f.where==='eq'?' · <b style="color:#ffe3a6">장착 중</b>':''}</div>
    ${Object.keys(it.imp).length?`<div class="imp">${impText(it)}</div>`:''}
    ${it.aff.map((a,i)=>`<div class="aff"><span>${affText(a,it)}</span><button data-act="reroll" data-i="${i}" ${canR?'':'disabled'} title="이 옵션을 무작위로 다시 뽑습니다">재련</button></div>`).join('')||'<div class="note">추가 옵션 없음</div>'}
    ${it.set?setBoxHTML(it.set,C.sets[it.set]||0):''}
    ${it.leg?`<div class="legbox"><b>${LEG[it.leg].n}</b>${LEG[it.leg].sk?` <span class="legsk">「${SKMAP[LEG[it.leg].sk].n}」 전용${S.slots.includes(LEG[it.leg].sk)?' · 장착 중':' · 이 스킬을 장착해야 효과'}</span>`:''}<br>${LEG[it.leg].d}</div>`:''}
    ${cmp}
    <div class="mbtns">
      ${f.where==='inv'?`<button class="pri" data-act="equip">장착</button>`:`<button data-act="unequip">해제</button>`}
      <button data-act="enh" ${canE?'':'disabled'}>${(it.enh||0)>=10?'최대 강화':`강화 +${(it.enh||0)+1}`}</button>
      ${f.where==='inv'?`<button data-act="lock">${it.lock?'잠금 해제':'잠금'}</button><button class="danger" data-act="salv" ${it.lock?'disabled':''}>분해 <span class="s">◆</span>${salvVal(it)}</button>`:''}
      <button data-act="close">닫기</button>
    </div>
    <div class="note">강화: <span class="s">◆</span>${fmt(ec.st)} + <span class="g">●</span>${fmt(ec.g)} — 기본 능력치와 고정 수치 옵션 +10% · 재련: <span class="s">◆</span>${rc.st} + <span class="g">●</span>${fmt(rc.g)}</div>
  </div>`;
  const m=$('#modal');m.innerHTML=h;m.classList.remove('hide');m.dataset.id=id;dirty('equip');
}
function closeModal(){const m=$('#modal');m.classList.add('hide');m.innerHTML='';RT.selId=null;dirty('equip');}
function modalAct(act,el){
  if(act==='gset'){const sid=el.dataset.id,i=+el.dataset.i,u=+el.dataset.u;const s=S.sock[sid]||(S.sock[sid]=[]);if(!gemUsedBy(u)){s[i]=u;recalc();}
    closeModal();dirty('skills','skillbar');return;}
  const id=+$('#modal').dataset.id;const f=findItem(id);if(!f&&act!=='close'){closeModal();return;}
  const it=f&&f.it;
  if(act==='close'){closeModal();return;}
  if(act==='equip'){S.inv.splice(f.idx,1);const old=S.eq[it.slot];S.eq[it.slot]=it;if(old)S.inv.push(old);recalc();closeModal();return;}
  if(act==='unequip'){if(S.inv.length>=INV_MAX){toast('가방이 가득 찼습니다',1);return;}delete S.eq[it.slot];S.inv.push(it);recalc();closeModal();return;}
  if(act==='lock'){it.lock=!it.lock;openItem(id);return;}
  if(act==='salv'){S.inv.splice(f.idx,1);S.stones+=salvVal(it);dirty('header');closeModal();return;}
  if(act==='enh'){const c=enhCost(it);if((it.enh||0)>=10||S.stones<c.st||S.gold<c.g)return;S.stones-=c.st;S.gold-=c.g;it.enh=(it.enh||0)+1;if(f.where==='eq')recalc();dirty('header');openItem(id);return;}
  if(act==='reroll'){const c=rerollCost(it);if(S.stones<c.st||S.gold<c.g)return;const i=+el.dataset.i;
    const used=new Set(it.aff.map(a=>a.k));used.delete(it.aff[i].k);const pool=Object.keys(AFF).filter(k=>!used.has(k));const k=pick(pool);
    S.stones-=c.st;S.gold-=c.g;it.aff[i]={k,v:rollAff(k,it.ilvl,it.rarity)};if(f.where==='eq')recalc();dirty('header');openItem(id);return;}
}
function panelAct(act,el){
  if(act==='sort'){const order=Object.fromEntries(SLOTS.map((s,i)=>[s.id,i]));const ro=[4,3,2,0,1];S.inv.sort((a,b)=>ro[a.rarity]-ro[b.rarity]||order[a.slot]-order[b.slot]||b.ilvl-a.ilvl);dirty('equip');}
  else if(act==='bulk'){const r=+el.dataset.r;let n=0,v=0;S.inv=S.inv.filter(it=>{if(it.rarity===r&&!it.lock){n++;v+=salvVal(it);return false;}return true;});S.stones+=v;if(n)toast(`${n}개 분해 · ◆${fmt(v)}`,1);dirty('equip','header');}
  else if(act==='bulkdown'){let n=0,v=0;S.inv=S.inv.filter(it=>{if(!it.lock&&it.rarity<3&&upgradeScore(it)<=1.01){n++;v+=salvVal(it);return false;}return true;});S.stones+=v;if(n)toast(`${n}개 분해 · ◆${fmt(v)} (전설·잠금 제외)`,1);dirty('equip','header');}
  else if(act==='slot'){const i=+el.dataset.i,id=el.dataset.id;if(S.slots[i]===id)S.slots[i]=null;else{S.slots=S.slots.map(x=>x===id?null:x);S.slots[i]=id;}dirty('skills','skillbar');}
  else if(act==='sockpick'){openGemPick(el.dataset.id,+el.dataset.i);}
  else if(act==='unsock'){const s=S.sock[el.dataset.id]||[];s[+el.dataset.i]=null;recalc();dirty('skills');}
  else if(act==='gmerge'){if(gemMerge(el.dataset.g,+el.dataset.r))dirty('skills');}
  else if(act==='gsalv'){const g=el.dataset.g,r=+el.dataset.r;const x=S.gems.find(z=>z.g===g&&z.r===r&&!gemUsedBy(z.u));if(x){S.gems=S.gems.filter(z=>z!==x);S.stones+=gemSalv(x);dirty('skills','header');}}
  else if(act==='br'){const id=el.dataset.id,ti=+el.dataset.t,o=el.dataset.o,ch=S.br[id]||(S.br[id]=[]);
    if(ch[ti]===o)return;if(ch[ti]){if(S.stones<brCost(ti))return;S.stones-=brCost(ti);}ch[ti]=o;
    const opt=SKMAP[id].br[ti].find(x=>x.id===o);toast(`${SKMAP[id].n} 갈래: ${opt.n}`,1);dirty('skills','header','skillbar','tabs');}
  else if(act==='skup'){const id=el.dataset.id,L=S.skills[id],c=Math.ceil(40*Math.pow(1.45,L-1));if(S.gold>=c&&L<30){S.gold-=c;S.skills[id]++;dirty('skills','header','skillbar','tabs');}}
  else if(act==='tal'||act==='tal5'){const T=TALENTS.find(t=>t.id===el.dataset.id);let n=act==='tal5'?5:1;while(n-->0&&tpLeft()>0&&(S.tal[T.id]||0)<T.max)S.tal[T.id]=(S.tal[T.id]||0)+1;recalc();dirty('talents','tabs');}
  else if(act==='talreset'){const c=50*S.lvl;if(S.gold>=c){S.gold-=c;S.tal={};recalc();dirty('talents','tabs','header');}}
  else if(act==='invf'){RT.invF=el.dataset.f;dirty('equip');}
  else if(act==='bestall'){let n=0;for(let pass=0;pass<14;pass++){let best=null,bs=1.01;for(const it of S.inv){const v=upgradeScore(it);if(v>bs){bs=v;best=it;}}
      if(!best)break;S.inv.splice(S.inv.indexOf(best),1);const old=S.eq[best.slot];S.eq[best.slot]=best;if(old)S.inv.push(old);recalc();n++;}
    if(n)toast(`${n}개 장착`,1);dirty('equip','tabs');}
  else if(act==='sortnow'){sortSweep(true);}
  else if(act==='install'){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;dirty('settings');});}}
  else if(act==='setdup'){const eqIl={},best={},K=it=>it.set+'/'+it.slot;
    for(const it of Object.values(S.eq))if(it&&it.set)eqIl[K(it)]=it.ilvl;
    for(const it of S.inv)if(it.set&&(!best[K(it)]||it.ilvl>best[K(it)].ilvl))best[K(it)]=it;
    let n=0,v=0;S.inv=S.inv.filter(it=>{if(it.set&&!it.lock&&(best[K(it)]!==it||(eqIl[K(it)]!==undefined&&eqIl[K(it)]>=it.ilvl))){n++;v+=salvVal(it);return false;}return true;});S.stones+=v;
    toast(n?`세트 조각 ${n}개 분해 · ◆${fmt(v)}`:'중복된 세트 조각이 없습니다',1);dirty('equip','header','tabs');}
  else if(act==='speed'){S.speed=+el.dataset.s;dirty('settings');}
  else if(act==='export'){save();const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#savebox').value=code;
    try{navigator.clipboard.writeText(code).then(()=>toast('저장 코드를 복사했습니다',1),()=>toast('아래 칸의 코드를 직접 복사하세요',1));}catch(e){toast('아래 칸의 코드를 직접 복사하세요',1);}}
  else if(act==='import'){const v=$('#savebox').value.trim();if(!v)return toast('불러올 코드를 칸에 붙여 넣으세요',1);
    try{applySave(JSON.parse(decodeURIComponent(escape(atob(v)))));afterLoad();save();toast('불러왔습니다',1);}catch(e){toast('코드를 읽을 수 없습니다',1);}}
  else if(act==='wipe'){if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='정말로? 한 번 더 누르면 초기화';return;}
    try{localStorage.removeItem(SAVE_KEY);}catch(e){}S=newState();RT.log=[];afterLoad();starterKit();save();}
}
document.addEventListener('click',e=>{
  const card=e.target.closest('.card[data-id]');if(card&&!e.target.closest('#modal')){openItem(+card.dataset.id);return;}
  const mb=e.target.closest('#modal [data-act]');if(mb){modalAct(mb.dataset.act,mb);return;}
  if(e.target.id==='modal'){closeModal();return;}
  const pb=e.target.closest('#panel [data-act]');if(pb&&pb.tagName==='BUTTON'){panelAct(pb.dataset.act,pb);return;}
  const tb=e.target.closest('#tabs button');if(tb){RT.tab=tb.dataset.tab;dirty('tabs','panel');return;}
});
document.addEventListener('change',e=>{const a=e.target.dataset&&e.target.dataset.act;if(a==='as'){S.autoSalv[+e.target.dataset.r]=e.target.checked;}
  else if(a==='sr'){S.sort[e.target.dataset.k]=e.target.checked;if(e.target.dataset.k==='on'&&e.target.checked){toast('자동 정리를 켰습니다',1);RT.sortT=29;}}
  else if(a==='swt'){S.sort.weakTo=+e.target.value;}
  else if(a==='ska'){const i=+e.target.dataset.i,v=e.target.value;S.sort.keep[i]=v||undefined;S.sort.keep=[...new Set(S.sort.keep.filter(Boolean))].slice(0,2);dirty('settings');}
  else if(a==='ae'){S.autoEquip=e.target.checked;if(S.autoEquip)toast('자동 장착을 켰습니다',1);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('#sPrev').onclick=()=>{if(S.stage>1){S.stage--;S.kills=0;RT.boss=false;RT.wantBoss=false;RT.enemies=[];recalc();dirty('stage');}};
$('#sNext').onclick=()=>{if(S.stage<S.maxStage){S.stage++;S.kills=0;RT.boss=false;RT.wantBoss=false;RT.enemies=[];recalc();dirty('stage');}};
$('#autoPush').onchange=e=>{S.autoPush=e.target.checked;dirty('stage');};
$('#bossBtn').onclick=()=>{if(RT.hero.dead>0)RT.wantBoss=true;else startBoss();};

// ================= 루프 =================
let lastT=performance.now(),acc=0,uiT=0;
function frame(now){
  const rdt=Math.min(0.1,(now-lastT)/1000);lastT=now;
  draw(rdt);tickSkillbar();
  requestAnimationFrame(frame);
}
function flushUI(){
  const d=RT.dirty;RT.dirty={};
  if(d.header||d.all)renderHeader();
  if(d.stage||d.all)renderStage();
  if(d.skillbar||d.all)renderSkillbar();
  if(d.log||d.all)renderLog();
  if(d.tabs||d.all)renderTabs();
  if(d.all||d.panel||d[RT.tab]){const p=$('#panel');const sy=p.scrollTop;renderPanel();p.scrollTop=sy;}
}
let lastLogic=performance.now();
setInterval(()=>{
  const now=performance.now();let dt=(now-lastLogic)/1000;lastLogic=now;
  if(dt>30){offline(dt);dt=0;}
  acc+=dt*S.speed;let n=0;while(acc>=0.05&&n<600){step(0.05);acc-=0.05;n++;}if(n>=600)acc=0;
  uiT+=Math.min(dt,1);if(uiT>=0.2){uiT=0;flushUI();}
},50);
setInterval(save,15000);
window.addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

function offline(sec){
  sec=Math.min(sec,8*3600);if(sec<60||!S.killRate)return;
  const k=S.killRate*sec*0.5,s=sc(S.stage),C=RT.cs;
  const g=k*2*s*(1+C.gold/100),x=k*4*s,st=Math.floor(k*0.24*2.2*(1+Math.floor(S.stage/10)));
  const lv0=S.lvl;S.gold+=g;S.stones+=st;gainXp(x);
  const m=$('#modal');m.dataset.id='0';
  m.innerHTML=`<div class="mbox"><h2 style="color:#f0d49a">돌아오셨군요</h2><div class="meta">자리를 비운 ${Math.floor(sec/3600)}시간 ${Math.floor(sec%3600/60)}분 동안 (효율 50%)</div>
    <div class="kv"><span>처치</span><b>${fmt(k)}</b><span>골드</span><b class="g">● ${fmt(g)}</b><span>마력석</span><b class="s">◆ ${fmt(st)}</b><span>경험치</span><b>${fmt(x)}${S.lvl>lv0?` (Lv ${lv0} → ${S.lvl})`:''}</b></div>
    <div class="mbtns"><button class="pri" data-act="close">계속하기</button></div></div>`;
  m.classList.remove('hide');dirty('all');
}
function starterKit(){
  const w=genItem(1,0);w.slot='weapon';w.base='낡은 장검';w.name='낡은 장검';w.imp={atk:6};w.aff=[];S.eq.weapon=w;recalc();RT.hero.hp=RT.cs.hp;
  log('잿빛 심연에 들어섰습니다. 전투는 자동으로 진행됩니다.');
}
function afterLoad(){RT.cs=null;RT.enemies=[];RT.boss=false;RT.wantBoss=false;RT.cds={};resetSkillFx();recalc();RT.hero.hp=RT.cs.hp;dirty('all');}

// ================= 시작 =================
resize();
const had=load();
afterLoad();
if(!had)starterKit();
else{log('돌아온 것을 환영합니다.');const away=(Date.now()-S.last)/1000;if(away>60)offline(away);}
requestAnimationFrame(frame);
</script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http")){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}</script>
